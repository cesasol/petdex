name: repro 792 open folder
on:
  push:
    branches: [repro/792-open-folder]
jobs:
  repro:
    runs-on: windows-latest
    env:
      CUSE_REF: 0ade4f9795f0ee8a49f0c2c0401c3ef0bdace0a4
    steps:
      - uses: oven-sh/setup-bun@v2
      - name: Build cuse
        shell: bash
        run: |
          git clone https://github.com/crafter-agents/cuse.git cuse-src
          git -C cuse-src checkout --detach "$CUSE_REF"
          (cd cuse-src && bun install --frozen-lockfile && bun run build)
          ./cuse-src/dist/cuse.exe os --json
      - name: Run matrix
        shell: pwsh
        run: |
          $cuse = "$PWD\cuse-src\dist\cuse.exe"
          $dir = "$env:USERPROFILE\.petdex\pets"
          New-Item -ItemType Directory -Force $dir | Out-Null
          New-Item -ItemType Directory -Force evidence | Out-Null
          function Reset-Desktop {
            Get-Process explorer -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -ne "" } | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process cmd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            (New-Object -ComObject Shell.Application).Windows() | ForEach-Object { $_.Quit() }
            Start-Sleep 2
          }
          function Probe($name, $file, $argList) {
            Reset-Desktop
            $p = Start-Process -FilePath $file -ArgumentList $argList -PassThru
            Start-Sleep 6
            $shell = (New-Object -ComObject Shell.Application).Windows() | ForEach-Object { $_.LocationURL }
            $opened = [bool]($shell | Where-Object { $_ -like "*petdex/pets*" })
            $titles = Get-Process | Where-Object { $_.MainWindowTitle -ne "" } | ForEach-Object { "$($_.ProcessName): $($_.MainWindowTitle)" }
            & $cuse windows --json | Out-File "evidence\$name-windows.json"
            & $cuse capture "evidence\$name.png" --json | Out-Null
            "{0,-28} opened={1} exited={2} titles=[{3}]" -f $name, $opened, $p.HasExited, ($titles -join " | ") | Tee-Object -Append evidence\summary.txt
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          function Matrix($tag) {
            Probe "$tag-cmd-start" "cmd.exe" @("/c", "start", '""', "`"$dir`"")
            Probe "$tag-explorer" "explorer.exe" @("`"$dir`"")
          }
          Matrix "baseline"
          # Break the default verb for folders the way a stale shell extension does.
          $clsid = "{0BADC0DE-0000-4000-8000-000000000792}"
          foreach ($k in "Directory", "Folder") {
            $base = "HKCU:\Software\Classes\$k\shell"
            New-Item -Force "$base\petdexbroken\command" | Out-Null
            Set-ItemProperty "$base" -Name "(default)" -Value "petdexbroken"
            New-ItemProperty -Force "$base\petdexbroken\command" -Name DelegateExecute -Value $clsid | Out-Null
          }
          Matrix "broken"
          Get-Content evidence\summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-792
          path: evidence
  e2e:
    runs-on: windows-latest
    env:
      CUSE_REF: 0ade4f9795f0ee8a49f0c2c0401c3ef0bdace0a4
      NATIVE_SDK_REMOTE: "https://github.com/Railly/native.git"
      NATIVE_SDK_BRANCH: "feat/floating-window-0.5.3"
      NATIVE_SDK_REF: "c0b10d027efa490fc99a3bc7f1cf88b015999d45"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Build SDK, cuse and both app variants
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATIVE_SDK_BRANCH" "$NATIVE_SDK_REMOTE" "$RUNNER_TEMP/native-sdk"
          git -C "$RUNNER_TEMP/native-sdk" fetch --depth 1 origin "$NATIVE_SDK_REF"
          git -C "$RUNNER_TEMP/native-sdk" checkout --detach "$NATIVE_SDK_REF"
          export NATIVE_SDK_PATH="$RUNNER_TEMP/native-sdk"
          scripts/patch-native-sdk.sh
          (cd "$NATIVE_SDK_PATH" && zig build cli)
          CLI="$NATIVE_SDK_PATH/zig-out/bin/native"
          git clone https://github.com/crafter-agents/cuse.git cuse-src
          git -C cuse-src checkout --detach "$CUSE_REF"
          (cd cuse-src && bun install --frozen-lockfile && bun run build)
          mkdir -p bins
          git worktree add "$RUNNER_TEMP/before" origin/main
          for v in before after; do
            src=$([ $v = before ] && echo "$RUNNER_TEMP/before" || echo "$PWD")
            (cd "$src/packages/petdex-desktop-native" && "$CLI" build -Dcpu=baseline -Dtrace=off)
            cp "$src/packages/petdex-desktop-native/zig-out/bin/petdex-desktop-native.exe" "bins/petdex-desktop-native-$v.exe"
          done
          ls -lh bins
      - name: Install a pet
        shell: pwsh
        run: |
          $dir = "$env:USERPROFILE\.petdex\pets\ci-pet"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $manifest = Invoke-RestMethod -Uri "https://petdex.dev/api/manifest/v2"
          $fields = @{}
          for ($i = 0; $i -lt $manifest.fields.Count; $i++) { $fields[[string]$manifest.fields[$i]] = $i }
          $row = @($manifest.pets | Where-Object {
            $path = ([string]$_[$fields["spritesheet"]]).Split("?", 2)[0].ToLowerInvariant()
            [int]$_[$fields["spriteVersionNumber"]] -eq 2 -and $path.EndsWith(".png")
          } | Select-Object -First 1)
          $sprite = [Uri]::new([Uri]$manifest.assetBase, [string]$row[0][$fields["spritesheet"]])
          Invoke-WebRequest -Uri $sprite.AbsoluteUri -OutFile "$dir\spritesheet.png"
          [ordered]@{ id = "ci-pet"; displayName = "CI Pet"; description = "ci"; spriteVersionNumber = [int]$row[0][$fields["spriteVersionNumber"]]; spritesheetPath = "spritesheet.png" } | ConvertTo-Json -Compress | Set-Content -Path "$dir\pet.json" -NoNewline
      - name: Click Open folder with a broken folder verb
        shell: pwsh
        run: |
          $cuse = "$PWD\cuse-src\dist\cuse.exe"
          New-Item -ItemType Directory -Force e2e | Out-Null
          $clsid = "{0BADC0DE-0000-4000-8000-000000000792}"
          foreach ($k in "Directory", "Folder") {
            $base = "HKCU:\Software\Classes\$k\shell"
            New-Item -Force "$base\petdexbroken\command" | Out-Null
            Set-ItemProperty "$base" -Name "(default)" -Value "petdexbroken"
            New-ItemProperty -Force "$base\petdexbroken\command" -Name DelegateExecute -Value $clsid | Out-Null
          }
          foreach ($v in "before", "after") {
            Get-Process petdex-desktop-native*, cmd -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            (New-Object -ComObject Shell.Application).Windows() | ForEach-Object { $_.Quit() }
            # First run with no hooked agent opens Settings on its own.
            '{"active_pet":"ci-pet","agents_prompted":false}' | Set-Content "$env:USERPROFILE\.petdex\desktop-native-settings.json" -NoNewline
            $app = Start-Process -FilePath "$PWD\bins\petdex-desktop-native-$v.exe" -PassThru -RedirectStandardError "e2e\$v.log"
            Start-Sleep 12
            & $cuse windows --json | Out-File "e2e\$v-windows.json"
            & $cuse elements --json 2>&1 | Out-File "e2e\$v-elements.json"
            $win = (& $cuse windows --json | ConvertFrom-Json).data | Where-Object { $_.title -eq "Petdex Settings" } | Select-Object -First 1
            "$v settings rect: $($win.x),$($win.y) $($win.width)x$($win.height)" | Tee-Object -Append e2e\summary.txt
            $cx = [int]($win.x + $win.width / 2); $cy = [int]($win.y + $win.height * 0.6)
            & $cuse focus "Petdex Settings" --json | Out-Null
            & $cuse move $cx $cy --json | Out-Null
            foreach ($i in 1..10) { & $cuse scroll down 10 --json | Out-Null; Start-Sleep -Milliseconds 200 }
            Start-Sleep 2
            & $cuse capture "e2e\$v-settings.png" --json | Out-Null
            $click = if (Test-Path "scenarios\792-open-folder.png") { & $cuse click --find="scenarios\792-open-folder.png" --json 2>&1 } else { "no template yet" }
            "$v click: $click" | Tee-Object -Append e2e\summary.txt
            Start-Sleep 6
            $opened = [bool]((New-Object -ComObject Shell.Application).Windows() | Where-Object { $_.LocationURL -like "*petdex/pets*" })
            $titles = Get-Process | Where-Object { $_.MainWindowTitle -ne "" } | ForEach-Object { "$($_.ProcessName): $($_.MainWindowTitle)" }
            & $cuse capture "e2e\$v-after-click.png" --json | Out-Null
            "{0,-7} opened={1} titles=[{2}]" -f $v, $opened, ($titles -join " | ") | Tee-Object -Append e2e\summary.txt
          }
          Get-Content e2e\summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-792
          path: e2e
